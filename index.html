
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBank Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🏦 SmartBank</h1>
    <p>Secure Banking Made Simple</p>
</header>

<main class="container">

    <!-- Registration -->
    <section class="card" id="registerSection">
        <h2>Create Bank Account</h2>

        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email Address">
        <input type="password" id="regPin" placeholder="Create 4-digit PIN"
               maxlength="4" inputmode="numeric">

        <button onclick="register()">Register Account</button>
    </section>

    <!-- Login -->
    <section class="card" id="loginSection">
        <h2>Customer Login</h2>

        <input type="text" id="loginAccount"
               placeholder="Account Number">

        <input type="password" id="loginPin"
               placeholder="Enter 4-digit PIN"
               maxlength="4" inputmode="numeric">

        <button onclick="login()">Login</button>
    </section>

    <!-- Dashboard -->
    <section class="card dashboard" id="dashboard" hidden>

        <h2>Welcome, <span id="customerName"></span></h2>

        <p>Account Number: <strong id="accountNumber"></strong></p>

        <div class="balance-box">
            <p>Available Balance</p>
            <h1>₹<span id="balance">0</span></h1>
        </div>

        <h3>Bank Transactions</h3>

        <input type="number" id="amount"
               placeholder="Enter Amount" min="1" step="0.01">

        <div class="buttons">
            <button onclick="deposit()">Deposit</button>
            <button onclick="withdraw()">Withdraw</button>
        </div>

        <button class="history-btn" onclick="showHistory()">
            Transaction History
        </button>

        <div id="history" hidden>
            <h3>Transaction History</h3>
            <ul id="transactionList"></ul>
        </div>

        <button class="logout" onclick="logout()">Logout</button>

    </section>

    <p id="message"></p>

</main>

<footer>
    <p>© 2026 SmartBank | All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
